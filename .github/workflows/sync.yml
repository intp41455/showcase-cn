name: 同步作品集
on:
  schedule:
    - cron: "17 16 * * *"   # 每天 UTC 16:17 同步一次（避开整点）
  workflow_dispatch:        # 允许手动触发
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 重新生成 index.html
        run: python generate.py
        env:
          GITHUB_USER: intp41455
      - name: 有变更则提交到 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "无变更，跳过"
          else
            git commit -m "chore: 自动同步作品集 $(date -u +%Y-%m-%d)"
            git push
          fi

      # ---- 国内镜像：同步到 Gitee（供 Gitee Pages 部署，国内手机/电脑均可访问，免备案）----
      - name: 同步 index.html 到 Gitee 仓库
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python sync_gitee.py

      # ---- 可选：触发 Gitee Pages 自动重新部署（实现真正全自动）----
      # 需在 GitHub Secrets 配置 GITEE_USERNAME 和 GITEE_PASSWORD(=私人令牌)
      # 并先在 Gitee 仓库「服务→Gitee Pages」手动启动一次（实名认证）
      # 启用下面这段即可，否则 Gitee Pages 免费版需手动点「更新」
